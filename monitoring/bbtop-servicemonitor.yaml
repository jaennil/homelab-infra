apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bbtop-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - sish
  selector:
    matchLabels:
      app.kubernetes.io/name: bbtop-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
      relabelings:
        # Default instance is the tunnel pod IP, which changes whenever that pod
        # is rescheduled, splitting the series and breaking saved links.
        - targetLabel: instance
          replacement: jaennil-honor
          action: replace
