apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bbtop-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - sish
  selector:
    matchLabels:
      app.kubernetes.io/name: bbtop-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
