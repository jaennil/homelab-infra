              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "citroen-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT CASE p.name\n       WHEN 'ESP81:MP_NIVEAU_LIQUIDE_DE_FREIN' THEN 'Тормозная жидкость ниже минимума'\n       WHEN 'BSM_2010:MP_ALERTE_PRESSION_HUILE_MOTEUR_a' THEN 'Лампа давления масла'\n       WHEN 'BSM_2010:MP_ALERTE_NIVEAU_EAU_MOTEUR' THEN 'Лампа уровня охлаждающей жидкости'\n       WHEN 'BSM_2010:MP_NIVEAU_LIQUIDE_LAVE_GLACE' THEN 'Омывайка на исходе'\n       WHEN 'BSM_2010:MP_TENSION_CAPTEUR_NIVEAU_HUILE_MOTEUR' THEN 'Датчик уровня масла, напряжение'\n       WHEN 'RBG_UDS:MP_COMPTEUR_DE_CHOCS' THEN 'Счётчик срабатываний подушек'\n       WHEN 'RBG_UDS:MP_ETAT_COMMUTATEUR_NEUTRALISATION_COUSSIN_PASSAGER' THEN 'Выключатель подушки пассажира'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_CONDUCTEUR_NIVEAU_1' THEN 'Цепь подушки водителя, Ом'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_PASSAGER_NIVEAU_1' THEN 'Цепь подушки пассажира, Ом'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_LATERAL_AVANT_GAUCHE' THEN 'Цепь боковой подушки, левая, Ом'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_LATERAL_AVANT_DROIT' THEN 'Цепь боковой подушки, правая, Ом'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_PRETENSIONNEUR_AVANT_GAUCHE' THEN 'Цепь преднатяжителя, левая, Ом'\n       WHEN 'RBG_UDS:MP_RESISTANCE_LIGNE_PRETENSIONNEUR_AVANT_DROIT' THEN 'Цепь преднатяжителя, правая, Ом'\n       ELSE coalesce(p.label, p.name) END AS \"Параметр\", p.unit AS \"Ед.\",\n       l.value AS \"Значение\", l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name IN ('ESP81:MP_NIVEAU_LIQUIDE_DE_FREIN', 'BSM_2010:MP_ALERTE_PRESSION_HUILE_MOTEUR_a', 'BSM_2010:MP_ALERTE_NIVEAU_EAU_MOTEUR', 'BSM_2010:MP_NIVEAU_LIQUIDE_LAVE_GLACE', 'BSM_2010:MP_TENSION_CAPTEUR_NIVEAU_HUILE_MOTEUR', 'RBG_UDS:MP_COMPTEUR_DE_CHOCS', 'RBG_UDS:MP_ETAT_COMMUTATEUR_NEUTRALISATION_COUSSIN_PASSAGER', 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_CONDUCTEUR_NIVEAU_1', 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_PASSAGER_NIVEAU_1', 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_LATERAL_AVANT_GAUCHE', 'RBG_UDS:MP_RESISTANCE_LIGNE_COUSSIN_LATERAL_AVANT_DROIT', 'RBG_UDS:MP_RESISTANCE_LIGNE_PRETENSIONNEUR_AVANT_GAUCHE', 'RBG_UDS:MP_RESISTANCE_LIGNE_PRETENSIONNEUR_AVANT_DROIT')\nORDER BY 1"
