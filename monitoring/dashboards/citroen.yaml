              "datasource": {
                "type": "postgres",
                "uid": "citroen-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH odo AS (\n  SELECT r.value AS km FROM reading r JOIN param p ON p.id = r.param_id\n  WHERE p.name = 'MP_KILOMETRAGE_TOTAL' ORDER BY r.ts DESC LIMIT 1),\nm AS (\n  SELECT m.*, odo.km AS now_km,\n    CASE WHEN m.interval_km IS NOT NULL AND m.last_km IS NOT NULL\n         THEN (odo.km - m.last_km) / m.interval_km * 100 END AS pct_km,\n    CASE WHEN m.interval_months IS NOT NULL AND m.last_ts IS NOT NULL\n         THEN EXTRACT(EPOCH FROM (now() - m.last_ts))\n              / (m.interval_months * 30.4375 * 86400) * 100 END AS pct_t\n  FROM maintenance m CROSS JOIN odo),\nr AS (\n  SELECT *,\n    CASE WHEN interval_km IS NULL AND interval_months IS NULL THEN NULL\n         WHEN last_ts IS NULL AND last_km IS NULL THEN 100\n         ELSE GREATEST(COALESCE(pct_km, 0), COALESCE(pct_t, 0)) END AS pct\n  FROM m)\nSELECT title AS \"Позиция\", pct AS \"Ресурс\"\nFROM r WHERE pct IS NOT NULL ORDER BY pct DESC"
            }
