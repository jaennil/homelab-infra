              "rawSql": "SELECT coalesce(p.label, p.name) AS \"Код и описание\", l.value AS \"Статус\",\n       l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name LIKE 'DTC:%'\nORDER BY 1"
