          "title": "Обороты / скорость (для расчёта передачи)",
          "datasource": {
            "type": "postgres",
            "uid": "citroen-postgres"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 58
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "citroen-postgres"
              },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT r1.ts AS \"time\", 'обороты / скорость' AS metric,\n       r1.value / r2.value AS value\nFROM reading r1\nJOIN param p1 ON p1.id = r1.param_id\n     AND p1.name = 'MP_REGIME_MOTEUR_AFFICHE'\nJOIN reading r2 ON r2.ts = r1.ts\nJOIN param p2 ON p2.id = r2.param_id\n     AND p2.name = 'MP_VITESSE_VEHICULE_a'\n-- ниже 15 км/ч сцепление буксует и отношение бессмысленно\nWHERE r2.value > 15 AND $__timeFilter(r1.ts)\nORDER BY 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "min",
                "max",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Каждой передаче соответствует своё отношение оборотов к скорости, поэтому по нему передача определяется однозначно. Набери данных в поездке с ровной скоростью на каждой передаче - на графике проявятся горизонтальные полосы, и я привяжу их к номерам передач."
        },
