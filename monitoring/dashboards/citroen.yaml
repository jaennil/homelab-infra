              "rawSql": "SELECT CASE p.name\n       WHEN 'V46_32:CONFIG_INDICE_TELECODAGE' THEN 'Индекс телекодирования'\n       WHEN 'V46_32:ID_FE_APPLICATION_FE' THEN 'Id fe application fe'\n       WHEN 'V46_32:ID_NOM_DU_FOURNISSEUR' THEN 'Поставщик блока'\n       WHEN 'V46_32:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL' THEN 'Доп. номер железа'\n       WHEN 'V46_32:ID_REFERENCE_FOURNISSEUR' THEN 'Номер поставщика'\n       WHEN 'V46_32:ID_REFERENCE_LOGICIEL' THEN 'Номер ПО'\n       WHEN 'V46_32:ID_REFERENCE_MATERIEL' THEN 'Номер железа'\n       WHEN 'V46_32:ID_TRACABILITE_INDICE_EVOLUTION_EDITION' THEN 'Id tracabilite indice evolution edition'\n       WHEN 'V46_32:ID_VERSION_DIAGNOSTIC' THEN 'Версия диагностики'\n       WHEN 'V46_32:ID_VERSION_DU_LOGICIEL' THEN 'Id version logiciel'\n       WHEN 'V46_32:ID_ZI_CODE_SYSTEME' THEN 'Id zi code systeme'\n       WHEN 'V46_32:MP_AUTORISATION_DEMARRAGE_CALCULATEURS_BV' THEN 'Autorisation demarrage calculateurs bv'\n       WHEN 'V46_32:MP_BESOIN_APPRENTISSAGE_BUTEES_PAPILLON' THEN 'Besoin apprentissage butees papillon'\n       WHEN 'V46_32:MP_COMPTEUR_NB_DEMARRAGE_A_FROID' THEN 'Счётчик холодных пусков'\n       WHEN 'V46_32:MP_CONSIGNE_POSITION_DEPHASEUR_AAC_ADMISSION' THEN 'Фазовращатель впуска, задание'\n       WHEN 'V46_32:MP_ESTIMATION_PUISSANCE_CONSO_COMPRESSEUR_REFRI' THEN 'Estimation puissance conso compresseur refri'\n       WHEN 'V46_32:MP_ETAT_APP_BUTEES_PAPILLON_MOTORISE' THEN 'Состояние app butees papillon motorise'\n       WHEN 'V46_32:MP_ETAT_COH_POSITION_AAC_ADMI_VIL' THEN 'Согласованность распредвала с коленвалом'\n       WHEN 'V46_32:MP_ETAT_GMP' THEN 'Состояние gmp'\n       WHEN 'V46_32:MP_ETAT_PROGRAMMATION_ANTI_DEMARRAGE' THEN 'Программирование иммобилайзера'\n       WHEN 'V46_32:MP_ETAT_REGULATION_SONDE_A_OXYGENE_AVAL' THEN 'Регулировка по датчику O2 после кат.'\n       WHEN 'V46_32:MP_ETAT_VERROUILLAGE_DEVERROUILLAGE_CALCULTATEUR' THEN 'Блокировка блока управления'\n       WHEN 'V46_32:MP_INFORMATION_POINT_DUR_PEDALE_ACCELERATEUR' THEN 'Information point dur pedale accelerateur'\n       WHEN 'V46_32:MP_INFO_DETECTION_CHOC' THEN 'Info detection choc'\n       WHEN 'V46_32:MP_OPTION_APPAIRAGE_CHOISIE' THEN 'Выбранный вариант привязки'\n       WHEN 'V46_32:MP_PB_TRANSMISSION_CODE_DEVERROUILLAGE' THEN 'Сбой передачи кода разблокировки'\n       WHEN 'V46_32:MP_RAPPORT_ENGAGE' THEN 'Rapport engage'\n       WHEN 'V46_32:MP_RCO_ELECTROVANNE_DEPHASEUR_ACC_1' THEN 'Клапан фазовращателя, скважность'\n       WHEN 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_01' THEN 'Снятие угла от детонации, цил. 1'\n       WHEN 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_02' THEN 'Снятие угла от детонации, цил. 2'\n       WHEN 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_03' THEN 'Снятие угла от детонации, цил. 3'\n       WHEN 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_04' THEN 'Снятие угла от детонации, цил. 4'\n       WHEN 'V46_32:MP_STATUS_PREMIER_APP_DEPH_AAC_ADM' THEN 'Status premier app deph aac adm'\n       WHEN 'V46_32:MP_TYPE_BOITE_VITESSES' THEN 'Type boite vitesses'\n       ELSE coalesce(p.label, p.name) END AS \"Параметр\", p.unit AS \"Ед.\",\n       l.value AS \"Значение\", l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name IN ('V46_32:CONFIG_INDICE_TELECODAGE', 'V46_32:ID_FE_APPLICATION_FE', 'V46_32:ID_NOM_DU_FOURNISSEUR', 'V46_32:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL', 'V46_32:ID_REFERENCE_FOURNISSEUR', 'V46_32:ID_REFERENCE_LOGICIEL', 'V46_32:ID_REFERENCE_MATERIEL', 'V46_32:ID_TRACABILITE_INDICE_EVOLUTION_EDITION', 'V46_32:ID_VERSION_DIAGNOSTIC', 'V46_32:ID_VERSION_DU_LOGICIEL', 'V46_32:ID_ZI_CODE_SYSTEME', 'V46_32:MP_AUTORISATION_DEMARRAGE_CALCULATEURS_BV', 'V46_32:MP_BESOIN_APPRENTISSAGE_BUTEES_PAPILLON', 'V46_32:MP_COMPTEUR_NB_DEMARRAGE_A_FROID', 'V46_32:MP_CONSIGNE_POSITION_DEPHASEUR_AAC_ADMISSION', 'V46_32:MP_ESTIMATION_PUISSANCE_CONSO_COMPRESSEUR_REFRI', 'V46_32:MP_ETAT_APP_BUTEES_PAPILLON_MOTORISE', 'V46_32:MP_ETAT_COH_POSITION_AAC_ADMI_VIL', 'V46_32:MP_ETAT_GMP', 'V46_32:MP_ETAT_PROGRAMMATION_ANTI_DEMARRAGE', 'V46_32:MP_ETAT_REGULATION_SONDE_A_OXYGENE_AVAL', 'V46_32:MP_ETAT_VERROUILLAGE_DEVERROUILLAGE_CALCULTATEUR', 'V46_32:MP_INFORMATION_POINT_DUR_PEDALE_ACCELERATEUR', 'V46_32:MP_INFO_DETECTION_CHOC', 'V46_32:MP_OPTION_APPAIRAGE_CHOISIE', 'V46_32:MP_PB_TRANSMISSION_CODE_DEVERROUILLAGE', 'V46_32:MP_RAPPORT_ENGAGE', 'V46_32:MP_RCO_ELECTROVANNE_DEPHASEUR_ACC_1', 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_01', 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_02', 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_03', 'V46_32:MP_RETRAIT_AVANCE_ALLUMAGE_CYLINDRE_04', 'V46_32:MP_STATUS_PREMIER_APP_DEPH_AAC_ADM', 'V46_32:MP_TYPE_BOITE_VITESSES')\nORDER BY 1"
