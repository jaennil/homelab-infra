          "description": "Байт статуса кода неисправности. Бит 0 - неисправность АКТИВНА сейчас, бит 3 - подтверждена и сохранена. Момент, когда P0116 из сохранённого становится активным, и есть искомое событие. Пишется watch_coolant.py раз в полминуты и dtc_read.py вручную."
