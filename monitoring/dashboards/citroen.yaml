            {
              "refId": "A",
              "datasource": {
                "type": "postgres",
                "uid": "citroen-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT CASE p.name\n       WHEN 'GEP:APC' THEN 'Зажигание включено'\n       WHEN 'GEP:CFG____ASSISTANCE_1' THEN 'Конфиг: тип усилителя'\n       WHEN 'GEP:ID_80_MP_INDICE_MESS' THEN 'Индекс сообщений'\n       WHEN 'GEP:ID_EDITION_LOGICIEL' THEN 'Редакция ПО'\n       WHEN 'GEP:ID_EDI_CALIB' THEN 'Редакция калибровки'\n       WHEN 'GEP:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL' THEN 'Доп. номер железа'\n       WHEN 'GEP:ID_REFERENCE_FOURNISSEUR' THEN 'Номер поставщика'\n       WHEN 'GEP:ID_REFERENCE_LOGICIEL' THEN 'Номер ПО'\n       WHEN 'GEP:ID_REFERENCE_PSA' THEN 'Номер PSA'\n       WHEN 'GEP:ID_VERSION_LOGICIEL_new_1' THEN 'Версия ПО'\n       WHEN 'GEP:TYPE_ANGLE_VOLANT_DE_DIRECTION' THEN 'Тип датчика угла руля'\n       ELSE coalesce(p.label, p.name) END AS \"Параметр\", p.unit AS \"Ед.\",\n       l.value AS \"Значение\", l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name IN ('GEP:APC', 'GEP:CFG____ASSISTANCE_1', 'GEP:ID_80_MP_INDICE_MESS', 'GEP:ID_EDITION_LOGICIEL', 'GEP:ID_EDI_CALIB', 'GEP:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL', 'GEP:ID_REFERENCE_FOURNISSEUR', 'GEP:ID_REFERENCE_LOGICIEL', 'GEP:ID_REFERENCE_PSA', 'GEP:ID_VERSION_LOGICIEL_new_1', 'GEP:TYPE_ANGLE_VOLANT_DE_DIRECTION')\nORDER BY 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
