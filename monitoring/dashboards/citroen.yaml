          "description": "Панель под охоту за отваливающимся датчиком температуры ОЖ. Заполняется скриптом watch_coolant.py, который сидит в блоке двигателя и опрашивает два запроса (21C08001 и 21CB8001) с частотой 2 Гц - обычная телеметрия сюда не пишет, она сидит на BSI и двигатель навещает набегами.\n\nЧТО ИСКАТЬ, с образцом. Событие поймано 31.08.2026 в 21:21:31 и выглядит так: 11 секунд ровных 93 °C при обдуве 29-30%, затем ОДИН замер 108 °C, обдув мгновенно 29% -> 100%, и за три секунды температура возвращается к 93. Скачок невозможен физически в обе стороны - масса антифриза не набирает 15 °C за полсекунды и не теряет их за три. Значит это датчик, а блок ему верит и гонит вентилятор на полную. Вот и причина того, что вентилятор иногда ненадолго ревёт.\n\nИщи вертикальную иглу на температуре и ступеньку обдува сразу за ней. Разрыв в линии - тоже событие: значение не пришло вовсе, и разрывы намеренно не сшиваются.\n\nВАЖНО про сигналы: главный - ЗАДАНИЕ ОБДУВА (жёлтое), оно плавно идёт за температурой: 17% при 53 °C, 22% при 70, 27% при 85, 30% при 93, и до 100% по требованию. Реле (пунктир) в нормальной работе почти всё время включено и само по себе мало о чём говорит - его оставили для полноты."
        },
