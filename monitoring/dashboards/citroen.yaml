          "description": "Нижний (после катализатора) датчик кислорода. На этой машине катализатор ВЫРЕЗАН, поэтому датчик стоит в пустой трубе и видит сырой выхлоп: он качается от 0 до 900 мВ примерно как верхний, и это нормально именно здесь.\n\nПравило \"ровная полка 550-800 мВ\" из учебников относится к машине с работающим катализатором и к этой машине НЕ применимо - поэтому пороговых линий на панели нет.\n\nЧем он всё-таки полезен: это вторая копия верхнего датчика. Сравнивай два графика между собой - если один качается, а второй замер ровной линией, значит замерший умер. Одинаковое качание обоих - оба живы.\n\nИсточник границ: свойства самой величины, не база DiagBox."
        },
