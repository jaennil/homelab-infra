              "rawSql": "SELECT CASE p.name\n       WHEN 'BPGA2010:ID_80_MP_INDICE_MESS' THEN 'Индекс сообщений'\n       WHEN 'BPGA2010:ID_MESS_DIAGNOSTIC' THEN 'Id mess diagnostic'\n       WHEN 'BPGA2010:ID_NOM_DU_FOURNISSEUR' THEN 'Поставщик блока'\n       WHEN 'BPGA2010:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL' THEN 'Доп. номер железа'\n       WHEN 'BPGA2010:ID_REFERENCE_MATERIEL' THEN 'Номер железа'\n       WHEN 'BPGA2010:ID_TRACABILITE_DATE_FABRICATION' THEN 'Дата изготовления'\n       WHEN 'BPGA2010:ID_TRACABILITE_NUMERO_DE_SERIE_PIECE' THEN 'Id tracabilite numero serie piece'\n       ELSE coalesce(p.label, p.name) END AS \"Параметр\", p.unit AS \"Ед.\",\n       l.value AS \"Значение\", l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name IN ('BPGA2010:ID_80_MP_INDICE_MESS', 'BPGA2010:ID_MESS_DIAGNOSTIC', 'BPGA2010:ID_NOM_DU_FOURNISSEUR', 'BPGA2010:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL', 'BPGA2010:ID_REFERENCE_MATERIEL', 'BPGA2010:ID_TRACABILITE_DATE_FABRICATION', 'BPGA2010:ID_TRACABILITE_NUMERO_DE_SERIE_PIECE')\nORDER BY 1"
