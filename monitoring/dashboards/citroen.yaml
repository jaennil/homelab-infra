              "rawSql": "SELECT CASE p.name\n       WHEN 'AAS_UDS:ID_80_MP_INDICE_MESS' THEN 'Индекс сообщений'\n       WHEN 'AAS_UDS:ID_DATE_TELECH' THEN 'Id date telech'\n       WHEN 'AAS_UDS:ID_FE_APPLICATION_FE' THEN 'Id fe application fe'\n       WHEN 'AAS_UDS:ID_MESS_DIAGNOSTIC' THEN 'Id mess diagnostic'\n       WHEN 'AAS_UDS:ID_NOMBRE_DE_TELECHARGEMENT' THEN 'Число загрузок ПО'\n       WHEN 'AAS_UDS:ID_NOM_DU_FOURNISSEUR' THEN 'Поставщик блока'\n       WHEN 'AAS_UDS:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL' THEN 'Доп. номер железа'\n       WHEN 'AAS_UDS:ID_REFERENCE_FOURNISSEUR' THEN 'Номер поставщика'\n       WHEN 'AAS_UDS:ID_REFERENCE_MATERIEL' THEN 'Номер железа'\n       WHEN 'AAS_UDS:ID_TRACABILITE_DATE_FABRICATION' THEN 'Дата изготовления'\n       WHEN 'AAS_UDS:ID_TRACABILITE_INDICE_EVOLUTION_EDITION' THEN 'Id tracabilite indice evolution edition'\n       WHEN 'AAS_UDS:ID_TRACABILITE_INDICE_EVOLUTION_EDITION_CALIBRATION' THEN 'Id tracabilite indice evolution edition calibration'\n       WHEN 'AAS_UDS:ID_TRACABILITE_NUMERO_DE_SERIE_PIECE' THEN 'Id tracabilite numero serie piece'\n       WHEN 'AAS_UDS:ID_VERSION_LOGICIEL' THEN 'Версия ПО'\n       WHEN 'AAS_UDS:ID_ZI_CODE_SYSTEME' THEN 'Id zi code systeme'\n       WHEN 'AAS_UDS:ID_ZI_FILE' THEN 'Id zi file'\n       ELSE coalesce(p.label, p.name) END AS \"Параметр\", p.unit AS \"Ед.\",\n       l.value AS \"Значение\", l.ts AS \"Обновлено\"\nFROM param p\nJOIN LATERAL (SELECT value, ts FROM reading WHERE param_id = p.id\n              ORDER BY ts DESC LIMIT 1) l ON true\nWHERE p.name IN ('AAS_UDS:ID_80_MP_INDICE_MESS', 'AAS_UDS:ID_DATE_TELECH', 'AAS_UDS:ID_FE_APPLICATION_FE', 'AAS_UDS:ID_MESS_DIAGNOSTIC', 'AAS_UDS:ID_NOMBRE_DE_TELECHARGEMENT', 'AAS_UDS:ID_NOM_DU_FOURNISSEUR', 'AAS_UDS:ID_REFERENCE_COMPLEMENTAIRE_MATERIEL', 'AAS_UDS:ID_REFERENCE_FOURNISSEUR', 'AAS_UDS:ID_REFERENCE_MATERIEL', 'AAS_UDS:ID_TRACABILITE_DATE_FABRICATION', 'AAS_UDS:ID_TRACABILITE_INDICE_EVOLUTION_EDITION', 'AAS_UDS:ID_TRACABILITE_INDICE_EVOLUTION_EDITION_CALIBRATION', 'AAS_UDS:ID_TRACABILITE_NUMERO_DE_SERIE_PIECE', 'AAS_UDS:ID_VERSION_LOGICIEL', 'AAS_UDS:ID_ZI_CODE_SYSTEME', 'AAS_UDS:ID_ZI_FILE')\nORDER BY 1"
