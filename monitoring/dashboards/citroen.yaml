              "uid": "citroen-postgres"
            },
            "query": "SELECT coalesce(label, name) AS \"__text\", name AS \"__value\" FROM param ORDER BY 1",
            "multi": true,
            "includeAll": false,
            "refresh": 1,
            "current": {
              "text": [
                "Обороты двигателя"
