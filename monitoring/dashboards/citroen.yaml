              "description": "Норма после прогрева 85-100 °C. Термостат открывается около 89 °C, вентилятор включается около 99 и 103 °C, поэтому выше 105 °C - уже не штатный нагрев. При прогреве значение идёт снизу, это нормально.\n\nВАЖНО для этой машины: в двигателе сохранён код P0116 - цепь датчика температуры ОЖ, показания вне допустимого диапазона. Пока код сохранён, вентилятор работает в аварийном режиме и включается чаще, даже когда живое показание в норме. То есть ровный график здесь НЕ значит, что датчик исправен.\n\n31.08.2026 датчик поймали с поличным: 93 °C ровно 11 секунд, потом ОДИН замер 108 °C и возврат к 93 за три секунды. Так антифриз себя вести не может - это выброс датчика, и блок на него отреагировал обдувом на 100%. Поэтому одиночная игла вверх здесь означает НЕ перегрев, а именно датчик; смотреть надо на длительность: настоящий перегрев держится минуты, а не полсекунды.\n\nИсточник границ: свойства самой величины, не база DiagBox."
