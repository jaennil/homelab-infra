'V46_32:MP_TEMPS_INJECTION_CYLINDRE_04' THEN 'Время впрыска, цилиндр 4'\n       WHEN 'V46_32:MP_TEMP_AIR_ADMISSION_SUP' THEN 'Температура воздуха на впуске'\n       WHEN 'V46_32:MP_TENSION_ALIMENTATION_CALCULATEUR_CONTROLE_MOTEUR' THEN 'Питание блока двигателя'\n       WHEN 'V46_32:MP_TENSION_ALIMENTATION_CAPTEURS_01' THEN 'Напряжение alimentation capteurs 01'\n       WHEN 'V46_32:MP_TENSION_ALIMENTATION_CAPTEURS_02' THEN 'Напряжение alimentation capteurs 02'\n       WHEN 'V46_32:MP_TENSION_ALIMENTATION_CAPTEURS_03' THEN 'Напряжение alimentation capteurs 03'\n       WHEN 'V46_32:MP_TENSION_RECOPIE_POSITION_PAPILLON_01' THEN 'Датчик дросселя 1'\n       WHEN 'V46_32:MP_TENSION_RECOPIE_POSITION_PAPILLON_02' THEN 'Датчик дросселя 2'\n       WHEN 'V46_32:MP_TENSION_SONDE_A_OXYGENE_AMONT' THEN 'Датчик кислорода до катализатора'\n       WHEN 'V46_32:MP_TENSION_SONDE_A_OXYGENE_AVAL' THEN 'Датчик кислорода после катализатора'\n       WHEN 'V46_32:MP_TYPE_BOITE_VITESSES' THEN 'Type boite vitesses'\n       WHEN 'V46_32:MP_VITESSE_CONSIGNE_LIMITATION_DE_VITESSE' THEN 'Скорость consigne limitation скорость'\n       ELSE coalesce(p.label, name) END AS \"__text\", name AS \"__value\" FROM param ORDER BY 1",
