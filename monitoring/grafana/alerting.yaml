apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  # Имя намеренно отличается от созданной ранее через интерфейс точки "Telegram":
  # две одноимённые делают маршрутизацию неоднозначной, а удалить старую Grafana
  # не дала (403, на неё ссылалась политика). Старая осталась неиспользуемой,
  # её можно убрать из интерфейса. Бот тот же, что у alertmanager - секрет
  # alertmanager-telegram; токен приходит переменной окружения, чтобы не лежать
  # в репозитории открытым.
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Telegram (git)
        receivers:
          - uid: telegram-main
            type: telegram
            settings:
              bottoken: $__env{TELEGRAM_BOT_TOKEN}
              chatid: "659782773"
              message: '{{ template "telegram.compact.git" . }}'

  templates.yaml: |
    apiVersion: 1
    templates:
      - orgID: 1
        name: telegram.compact.git
        template: |
          {{ define "telegram.compact.git" -}}
          {{ if gt (len .Alerts.Firing) 0 -}}
          🚨 Активные алерты: {{ len .Alerts.Firing }}
          {{ range .Alerts.Firing }}
          {{ if eq .Labels.alertname "AgentRateLimitCritical" -}}

          Критический лимит: {{ if eq .Labels.provider "codex" }}Codex{{ else if eq .Labels.provider "claude_code" }}Claude Code{{ else }}{{ .Labels.provider }}{{ end }}
          Период: {{ .Labels.window }}
          Статус: использовано не менее 95%
          Лимит почти исчерпан.
          {{ else if eq .Labels.alertname "AgentRateLimitPaceHigh" -}}

          Высокий темп расхода: {{ if eq .Labels.provider "codex" }}Codex{{ else if eq .Labels.provider "claude_code" }}Claude Code{{ else }}{{ .Labels.provider }}{{ end }}
          Период: {{ .Labels.window }}
          Расход опережает равномерный бюджет текущего окна.
          {{ else if eq .Labels.alertname "GatewayKafkaDeliveryError" -}}

          Ошибка доставки событий
          Gateway не смог поставить событие в очередь или доставить его в Kafka.
          {{ else if eq .Labels.alertname "EventPipelineTargetDown" -}}

          Сервис недоступен: {{ .Labels.service }}
          Prometheus не может опросить сервис больше минуты.
          {{ else -}}

          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end -}}
          Открыть алерт: {{ .GeneratorURL }}
          {{ end }}
          {{ end -}}
          {{ if gt (len .Alerts.Resolved) 0 -}}
          ✅ Восстановлено: {{ len .Alerts.Resolved }}
          {{ range .Alerts.Resolved }}
          {{ if eq .Labels.alertname "AgentRateLimitCritical" -}}

          Лимит снова ниже критического: {{ if eq .Labels.provider "codex" }}Codex{{ else if eq .Labels.provider "claude_code" }}Claude Code{{ else }}{{ .Labels.provider }}{{ end }} · {{ .Labels.window }}
          {{ else -}}

          {{ .Annotations.summary }}
          {{ end }}
          {{ end }}
          {{ end -}}
          {{ end }}

  # ВАЖНО: этот файл управляет КОРНЕВОЙ политикой, то есть маршрутизацией всех
  # алертов Grafana, а не только машинных. До него корень был настроен через
  # интерфейс и указывал на Telegram - здесь то же поведение, но уже в git.
  # Побочный эффект: политику теперь нельзя править из интерфейса (provenance=file),
  # изменения только через этот файл.
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Telegram (git)
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: citroen
        folder: Citroen
        # Раз в минуту: данные приходят пачками при подключённой Lexia,
        # чаще смысла нет.
        interval: 1m
        rules:
          # Обслуживание: считается по таблице maintenance против текущего пробега BSI,
          # те же пороги 80/100 %, что и зоны на дашборде. Одна строка запроса - одна
          # позиция, поэтому алерт приходит по каждой отдельно, с её названием.
          - uid: citroen-maint-due
            title: Пора обслуживать
            condition: C
            noDataState: OK
            execErrState: OK
            for: 10m
            labels:
              severity: critical
              service: citroen
            annotations:
              summary: '{{ $labels.title }}: ресурс выработан ({{ printf "%.0f" $values.B.Value }} %) или дата последней замены неизвестна.'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: table
                  rawQuery: true
                  rawSql: |
                    WITH odo AS (
                      SELECT r.value AS km FROM reading r JOIN param p ON p.id = r.param_id
                      WHERE p.name = 'MP_KILOMETRAGE_TOTAL' ORDER BY r.ts DESC LIMIT 1),
                    m AS (
                      SELECT m.*,
                        CASE WHEN m.interval_km IS NOT NULL AND m.last_km IS NOT NULL
                             THEN (odo.km - m.last_km) / m.interval_km * 100 END AS pct_km,
                        CASE WHEN m.interval_months IS NOT NULL AND m.last_ts IS NOT NULL
                             THEN EXTRACT(EPOCH FROM (now() - m.last_ts))
                                  / (m.interval_months * 30.4375 * 86400) * 100 END AS pct_t
                      FROM maintenance m CROSS JOIN odo)
                    SELECT title,
                      CASE WHEN interval_km IS NULL AND interval_months IS NULL THEN NULL
                           WHEN last_ts IS NULL AND last_km IS NULL THEN 100
                           ELSE GREATEST(COALESCE(pct_km, 0), COALESCE(pct_t, 0)) END AS pct
                    FROM m WHERE interval_km IS NOT NULL OR interval_months IS NOT NULL
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [99.99] }

          # Обслуживание: считается по таблице maintenance против текущего пробега BSI,
          # те же пороги 80/100 %, что и зоны на дашборде. Одна строка запроса - одна
          # позиция, поэтому алерт приходит по каждой отдельно, с её названием.
          - uid: citroen-maint-soon
            title: Скоро обслуживание
            condition: C
            noDataState: OK
            execErrState: OK
            for: 10m
            labels:
              severity: warning
              service: citroen
            annotations:
              summary: '{{ $labels.title }}: выработано {{ printf "%.0f" $values.B.Value }} % ресурса, планируй замену.'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: table
                  rawQuery: true
                  rawSql: |
                    WITH odo AS (
                      SELECT r.value AS km FROM reading r JOIN param p ON p.id = r.param_id
                      WHERE p.name = 'MP_KILOMETRAGE_TOTAL' ORDER BY r.ts DESC LIMIT 1),
                    m AS (
                      SELECT m.*,
                        CASE WHEN m.interval_km IS NOT NULL AND m.last_km IS NOT NULL
                             THEN (odo.km - m.last_km) / m.interval_km * 100 END AS pct_km,
                        CASE WHEN m.interval_months IS NOT NULL AND m.last_ts IS NOT NULL
                             THEN EXTRACT(EPOCH FROM (now() - m.last_ts))
                                  / (m.interval_months * 30.4375 * 86400) * 100 END AS pct_t
                      FROM maintenance m CROSS JOIN odo)
                    SELECT title,
                      CASE WHEN interval_km IS NULL AND interval_months IS NULL THEN NULL
                           WHEN last_ts IS NULL AND last_km IS NULL THEN 100
                           ELSE GREATEST(COALESCE(pct_km, 0), COALESCE(pct_t, 0)) END AS pct
                    FROM m WHERE interval_km IS NOT NULL OR interval_months IS NOT NULL
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: within_range, params: [80, 99.99] }

          - uid: citroen-oil-temp-warn
            title: Температура масла высокая
            condition: C
            # Машина стоит - данных нет, и это не повод для алерта,
            # поэтому noDataState OK.
            noDataState: OK
            execErrState: OK
            for: 5m
            labels:
              severity: warning
              service: citroen
            annotations:
              summary: "Масло выше 125 °C ({{ $values.B }} °C). Долго так держать не стоит."
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: time_series
                  rawQuery: true
                  rawSql: |
                    SELECT r.ts AS "time", r.value
                    FROM reading r JOIN param p ON p.id = r.param_id
                    WHERE p.name = 'MP_TEMPERATURE_HUILE_MOTEUR_CALCULEE'
                      AND $__timeFilter(r.ts)
                    ORDER BY 1
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [125] }

          - uid: citroen-oil-temp-crit
            title: Температура масла критическая
            condition: C
            noDataState: OK
            execErrState: OK
            for: 1m
            labels:
              severity: critical
              service: citroen
            annotations:
              summary: "Масло выше 140 °C ({{ $values.B }} °C). Искать причину."
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: time_series
                  rawQuery: true
                  rawSql: |
                    SELECT r.ts AS "time", r.value
                    FROM reading r JOIN param p ON p.id = r.param_id
                    WHERE p.name = 'MP_TEMPERATURE_HUILE_MOTEUR_CALCULEE'
                      AND $__timeFilter(r.ts)
                    ORDER BY 1
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [140] }

          - uid: citroen-batt-low
            title: Напряжение бортсети низкое
            condition: C
            noDataState: OK
            execErrState: OK
            for: 10m
            labels:
              severity: warning
              service: citroen
            annotations:
              summary: "Питание BSI ниже 11.5 В ({{ $values.B }} В). Похоже на разряд АКБ."
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: time_series
                  rawQuery: true
                  rawSql: |
                    SELECT r.ts AS "time", r.value
                    FROM reading r JOIN param p ON p.id = r.param_id
                    WHERE p.name = 'MP_TENSION_ALIMENTION_BSI'
                      AND $__timeFilter(r.ts)
                    ORDER BY 1
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [11.5] }
