apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  # Имя намеренно отличается от созданной ранее через интерфейс точки "Telegram":
  # две одноимённые делают маршрутизацию неоднозначной, а удалить старую Grafana
  # не дала (403, на неё ссылалась политика). Старая осталась неиспользуемой,
  # её можно убрать из интерфейса. Бот тот же, что у alertmanager - секрет
  # alertmanager-telegram; токен приходит переменной окружения, чтобы не лежать
  # в репозитории открытым.
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Telegram (git)
        receivers:
          - uid: telegram-main
            type: telegram
            settings:
              bottoken: $__env{TELEGRAM_BOT_TOKEN}
              chatid: "659782773"
              message: '{{ template "telegram.compact.git" . }}'

  templates.yaml: |
    apiVersion: 1
    templates:
      - orgID: 1
        name: telegram.compact.git
        template: |
          {{ define "telegram.compact.git" -}}
          {{ if gt (len .Alerts.Firing) 0 -}}
          🚨 Активные алерты: {{ len .Alerts.Firing }}
          {{ range .Alerts.Firing }}
          {{ if eq .Labels.alertname "AgentRateLimitCritical" -}}

          Критический лимит: {{ if eq .Labels.provider "codex" }}🤖 Codex{{ else if eq .Labels.provider "claude_code" }}🟠 Claude Code{{ else }}{{ .Labels.provider }}{{ end }}
          Окно: {{ if eq .Labels.window "5h" }}⏱️ 5h{{ else if eq .Labels.window "7d" }}📅 7d{{ else }}🕒 {{ .Labels.window }}{{ end }}
          Статус: использовано не менее 95%
          Лимит почти исчерпан.
          {{ else if eq .Labels.alertname "AgentRateLimitPaceHigh" -}}

          Высокий темп расхода: {{ if eq .Labels.provider "codex" }}🤖 Codex{{ else if eq .Labels.provider "claude_code" }}🟠 Claude Code{{ else }}{{ .Labels.provider }}{{ end }}
          Окно: {{ if eq .Labels.window "5h" }}⏱️ 5h{{ else if eq .Labels.window "7d" }}📅 7d{{ else }}🕒 {{ .Labels.window }}{{ end }}
          Использовано: {{ .Annotations.usage_percent }}
          Норма к этому моменту: {{ .Annotations.budget_percent }}
          Выше нормы на: +{{ .Annotations.excess_pp }} п.п.
          {{ else if eq .Labels.alertname "GatewayKafkaDeliveryError" -}}

          Ошибка доставки событий
          Gateway не смог поставить событие в очередь или доставить его в Kafka.
          {{ else if eq .Labels.alertname "EventPipelineTargetDown" -}}

          Сервис недоступен: {{ .Labels.service }}
          Prometheus не может опросить сервис больше минуты.
          {{ else -}}

          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end -}}
          {{ end }}
          {{ with (index .Alerts.Firing 0) }}
          🔗 График, история и отключение алерта: {{ .GeneratorURL }}
          {{ end }}
          {{ end -}}
          {{ if gt (len .Alerts.Resolved) 0 -}}
          ✅ Восстановлено: {{ len .Alerts.Resolved }}
          {{ range .Alerts.Resolved }}
          {{ if eq .Labels.alertname "AgentRateLimitCritical" -}}

          Лимит снова ниже критического: {{ if eq .Labels.provider "codex" }}🤖 Codex{{ else if eq .Labels.provider "claude_code" }}🟠 Claude Code{{ else }}{{ .Labels.provider }}{{ end }} · {{ if eq .Labels.window "5h" }}⏱️ 5h{{ else if eq .Labels.window "7d" }}📅 7d{{ else }}🕒 {{ .Labels.window }}{{ end }}
          {{ else if eq .Labels.alertname "AgentRateLimitPaceHigh" -}}

          Темп снова в норме: {{ if eq .Labels.provider "codex" }}🤖 Codex{{ else if eq .Labels.provider "claude_code" }}🟠 Claude Code{{ else }}{{ .Labels.provider }}{{ end }} · {{ if eq .Labels.window "5h" }}⏱️ 5h{{ else if eq .Labels.window "7d" }}📅 7d{{ else }}🕒 {{ .Labels.window }}{{ end }}
          {{ else -}}

          {{ .Annotations.summary }}
          {{ end }}
          {{ end }}
          {{ end -}}
          {{ end }}

  # ВАЖНО: этот файл управляет КОРНЕВОЙ политикой, то есть маршрутизацией всех
  # алертов Grafana, а не только машинных. До него корень был настроен через
  # интерфейс и указывал на Telegram - здесь то же поведение, но уже в git.
  # Побочный эффект: политику теперь нельзя править из интерфейса (provenance=file),
  # изменения только через этот файл.
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Telegram (git)
        group_by: [alertname]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

  rules.yaml: |
    apiVersion: 1
    # Провижининг из файла НЕ удаляет правила, которых в файле больше нет: их надо
    # перечислить здесь явно. Четыре ручных правила заменены общим citroen-red-zone.
    deleteRules:
      - orgId: 1
        uid: citroen-lamps
      - orgId: 1
        uid: citroen-oil-temp-warn
      - orgId: 1
        uid: citroen-oil-temp-crit
      - orgId: 1
        uid: citroen-batt-low
    groups:
      - orgId: 1
        name: citroen
        folder: Citroen
        # Раз в минуту: данные приходят пачками при подключённой Lexia,
        # чаще смысла нет.
        interval: 1m
        rules:
          # Обслуживание: считается по таблице maintenance против текущего пробега BSI,
          # те же пороги 80/100 %, что и зоны на дашборде. Одна строка запроса - одна
          # позиция, поэтому алерт приходит по каждой отдельно, с её названием.
          - uid: citroen-maint-due
            title: Пора обслуживать
            condition: C
            noDataState: OK
            execErrState: OK
            for: 10m
            labels:
              severity: critical
              service: citroen
            annotations:
              summary: '{{ $labels.title }}: ресурс выработан ({{ printf "%.0f" $values.B.Value }} %) или дата последней замены неизвестна.'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: table
                  rawQuery: true
                  rawSql: |
                    WITH odo AS (
                      SELECT r.value AS km FROM reading r JOIN param p ON p.id = r.param_id
                      WHERE p.name = 'MP_KILOMETRAGE_TOTAL' ORDER BY r.ts DESC LIMIT 1),
                    m AS (
                      SELECT m.*,
                        CASE WHEN m.interval_km IS NOT NULL AND m.last_km IS NOT NULL
                             THEN (odo.km - m.last_km) / m.interval_km * 100 END AS pct_km,
                        CASE WHEN m.interval_months IS NOT NULL AND m.last_ts IS NOT NULL
                             THEN EXTRACT(EPOCH FROM (now() - m.last_ts))
                                  / (m.interval_months * 30.4375 * 86400) * 100 END AS pct_t
                      FROM maintenance m CROSS JOIN odo)
                    SELECT title,
                      CASE WHEN interval_km IS NULL AND interval_months IS NULL THEN NULL
                           WHEN last_ts IS NULL AND last_km IS NULL THEN 100
                           ELSE GREATEST(COALESCE(pct_km, 0), COALESCE(pct_t, 0)) END AS pct
                    FROM m WHERE interval_km IS NOT NULL OR interval_months IS NOT NULL
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [99.99] }

          # Обслуживание: считается по таблице maintenance против текущего пробега BSI,
          # те же пороги 80/100 %, что и зоны на дашборде. Одна строка запроса - одна
          # позиция, поэтому алерт приходит по каждой отдельно, с её названием.
          - uid: citroen-maint-soon
            title: Скоро обслуживание
            condition: C
            noDataState: OK
            execErrState: OK
            for: 10m
            labels:
              severity: warning
              service: citroen
            annotations:
              summary: '{{ $labels.title }}: выработано {{ printf "%.0f" $values.B.Value }} % ресурса, планируй замену.'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: table
                  rawQuery: true
                  rawSql: |
                    WITH odo AS (
                      SELECT r.value AS km FROM reading r JOIN param p ON p.id = r.param_id
                      WHERE p.name = 'MP_KILOMETRAGE_TOTAL' ORDER BY r.ts DESC LIMIT 1),
                    m AS (
                      SELECT m.*,
                        CASE WHEN m.interval_km IS NOT NULL AND m.last_km IS NOT NULL
                             THEN (odo.km - m.last_km) / m.interval_km * 100 END AS pct_km,
                        CASE WHEN m.interval_months IS NOT NULL AND m.last_ts IS NOT NULL
                             THEN EXTRACT(EPOCH FROM (now() - m.last_ts))
                                  / (m.interval_months * 30.4375 * 86400) * 100 END AS pct_t
                      FROM maintenance m CROSS JOIN odo)
                    SELECT title,
                      CASE WHEN interval_km IS NULL AND interval_months IS NULL THEN NULL
                           WHEN last_ts IS NULL AND last_km IS NULL THEN 100
                           ELSE GREATEST(COALESCE(pct_km, 0), COALESCE(pct_t, 0)) END AS pct
                    FROM m WHERE interval_km IS NOT NULL OR interval_months IS NOT NULL
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: within_range, params: [80, 99.99] }

          # Температура ОЖ: те же зоны, что на дашборде (norms.py): 105 - охлаждение не
          # справляется. 3 минуты подряд, чтобы не ловить одиночный выброс датчика.
          - uid: citroen-coolant-hot
            title: Перегрев охлаждающей жидкости
            condition: C
            noDataState: OK
            execErrState: OK
            for: 3m
            labels:
              severity: critical
              service: citroen
            annotations:
              summary: 'Температура ОЖ {{ printf "%.0f" $values.B.Value }} °C - выше 105, охлаждение не справляется.'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: time_series
                  rawQuery: true
                  rawSql: |
                    SELECT r.ts AS "time", r.value
                    FROM reading r JOIN param p ON p.id = r.param_id
                    WHERE p.name = 'V46_32:MP_TEMPERATURE_D_EAU_MOTEUR_d'
                      AND r.ts > now() - interval '10 minutes'
                    ORDER BY 1
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [105] }

          # Бортовое напряжение при работающем двигателе: ниже 12.8 В пять минут -
          # генератор не тянет или ремень. Считается только по замерам, когда обороты
          # выше 500, иначе сработает на каждой стоянке с включённым зажиганием.
          - uid: citroen-voltage-low
            title: Низкое напряжение при работающем двигателе
            condition: C
            noDataState: OK
            execErrState: OK
            for: 5m
            labels:
              severity: warning
              service: citroen
            annotations:
              summary: 'Напряжение BSI {{ printf "%.1f" $values.B.Value }} В при работающем двигателе - генератор не заряжает?'
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: time_series
                  rawQuery: true
                  rawSql: |
                    SELECT v.ts AS "time", v.value
                    FROM reading v JOIN param pv ON pv.id = v.param_id
                    JOIN reading e ON e.ts = v.ts
                    JOIN param pe ON pe.id = e.param_id
                    WHERE pv.name = 'MP_TENSION_ALIMENTION_BSI'
                      AND pe.name = 'MP_REGIME_MOTEUR_AFFICHE' AND e.value > 500
                      AND v.ts > now() - interval '5 minutes'
                    ORDER BY 1
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: mean }
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [12.8] }
          # Общее правило по КРАСНЫМ ЗОНАМ. Зоны лежат в таблице norm_zone, которую
          # sync.py переписывает из norms.py при каждой досылке: новая зона на дашборде =
          # новый алерт, без правки этого файла. Берётся последнее значение параметра за
          # 30 минут; строка есть - значение в красном отрезке - и это отдельный экземпляр
          # алерта со своим названием. Машина заглушена, данных нет - алерт гаснет сам.
          # Условные вещи (напряжение только при работающем двигателе) зоной не выразить,
          # они остаются ручными правилами выше.
          - uid: citroen-red-zone
            title: Красная зона
            condition: C
            noDataState: OK
            execErrState: OK
            for: 2m
            labels:
              severity: critical
              service: citroen
            annotations:
              summary: '{{ $labels.title }}: значение в красной зоне ({{ $labels.zone }}).'
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: citroen-postgres
                model:
                  refId: A
                  format: table
                  rawQuery: true
                  rawSql: |
                    SELECT z.title, z.zone, 1 AS alarm
                    FROM norm_zone z
                    JOIN param p ON p.name = z.name
                    JOIN LATERAL (SELECT value FROM reading
                                  WHERE param_id = p.id AND ts > now() - interval '30 minutes'
                                  ORDER BY ts DESC LIMIT 1) l ON true
                    WHERE (z.lo IS NULL OR l.value >= z.lo)
                      AND (z.hi IS NULL OR l.value < z.hi)
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0.5] }
