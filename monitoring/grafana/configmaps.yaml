apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki.logging:3100
        editable: false
      - name: Jaeger
        uid: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability:16686
        editable: false
        jsonData:
          tracesToLogs:
            datasourceUid: Loki
            tags: ['job', 'instance', 'pod', 'namespace']
          tracesToMetrics:
            datasourceUid: Prometheus
          nodeGraph:
            enabled: true
      - name: Life Dashboard PostgreSQL
        uid: life-dashboard-postgres
        type: postgres
        access: proxy
        url: postgres-rw.life-dashboard.svc.cluster.local:5432
        user: grafana_reader
        database: lifedashboard
        editable: false
        jsonData:
          sslmode: require
          postgresVersion: 1500
          timescaledb: false
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
        secureJsonData:
          password: $GRAFANA_READER_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'sidecar'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
