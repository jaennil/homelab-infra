# The laptop agent reaches Prometheus through the sish tunnel because it is not
# always on this network. This node is the machine Prometheus itself runs on, so
# it is scraped straight over the LAN. A Service with hand-written Endpoints
# would be the usual trick, but this Argo CD excludes the Endpoints kind from
# sync, so the target is declared to the operator directly instead.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: bbtop-node
  namespace: monitoring
spec:
  staticConfigs:
    - targets:
        - 192.168.3.4:9099
  metricsPath: /metrics
  scrapeInterval: 5s
  scrapeTimeout: 3s
  relabelings:
    # Without this the job is named scrapeConfig/monitoring/bbtop-node.
    - targetLabel: job
      replacement: bbtop-node
      action: replace
