# Включать после dialogue-insights-infra: тот поднимает namespace, CNPG-кластер
# и секреты, без которых поды здесь встанут в CreateContainerConfigError.
# Команды запечатывания - в dialogue-insights/sealed-secrets.yaml.example.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dialogue-insights
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jaennil/dialogue-insights
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: dialogue-insights
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
