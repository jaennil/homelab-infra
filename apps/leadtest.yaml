apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leadtest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaennil/leadtest.git
    path: k8s/overlays/production
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: leadtest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
