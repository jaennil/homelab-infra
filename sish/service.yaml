apiVersion: v1
kind: Service
metadata:
  name: sish-ssh
  namespace: sish
  labels:
    app.kubernetes.io/name: sish
spec:
  type: NodePort
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
      nodePort: 32222
      protocol: TCP
  selector:
    app.kubernetes.io/name: sish
---
apiVersion: v1
kind: Service
metadata:
  name: bbtop-agent-tunnel
  namespace: sish
  labels:
    app.kubernetes.io/name: bbtop-agent
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9099
      targetPort: 19099
      protocol: TCP
  selector:
    app.kubernetes.io/name: sish
---
apiVersion: v1
kind: Service
metadata:
  name: project-ai-usage-tunnel
  namespace: sish
  labels:
    app.kubernetes.io/name: project-ai-usage-tunnel
spec:
  type: ClusterIP
  ports:
    - name: prometheus
      port: 9090
      targetPort: 19090
      protocol: TCP
    - name: clickhouse-http
      port: 8123
      targetPort: 18123
      protocol: TCP
  selector:
    app.kubernetes.io/name: sish
---
apiVersion: v1
kind: Service
metadata:
  name: sish-http
  namespace: sish
  labels:
    app.kubernetes.io/name: sish
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: sish
