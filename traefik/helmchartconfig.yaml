apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    deployment:
      replicas: 3
      kind: DaemonSet
    nodeSelector: {}
    service:
      spec:
        # Без этого k3s подменяет адрес источника на адрес узла ещё до traefik:
        # приложения видят 10.42.0.1 вместо адреса человека, журналы входов
        # бесполезны, а лимиты по IP становятся общими на всех сразу. traefik
        # стоит DaemonSet-ом, поэтому эндпоинт есть на каждом узле и Local не
        # обрежет трафик.
        externalTrafficPolicy: Local
